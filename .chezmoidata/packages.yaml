# =============================================================
# TODO el software del sistema, declarado en un solo lugar.
# Editá estas listas y corré `chezmoi apply`: los scripts run_once
# se re-ejecutan solos cuando su contenido cambia (y estas listas
# forman parte de ese contenido).
#
# Lista Mac generada a partir del entorno real (brew list, 2026-07-31).
# =============================================================
packages:
  darwin:
    brews:
      # --- básicos ---
      - git
      - curl
      - wget
      - zsh
      - gh
      - git-filter-repo
      # --- terminal / productividad ---
      - jq
      - yq
      - ripgrep
      - fzf          # nuevo: Ctrl-R historia difusa (integrado en .zshrc)
      - bat          # nuevo: cat con colores (alias en .aliases)
      - tree
      - htop
      - watch
      - ncdu
      - midnight-commander
      - tmux
      - shellcheck
      # --- seguridad / secretos ---
      - age
      - sops
      - gnupg
      - pinentry-mac
      # --- kubernetes ---
      - kubernetes-cli   # kubectl
      - helm
      - kustomize
      - kubecm
      - k9s          # nuevo: TUI de clusters, complementa kubecm
      - flux
      # --- clouds ---
      - oci-cli
      - awscli       # no lo tenías instalado; agregado porque trabajás con AWS (borralo si no)
      - azure-cli    # ídem Azure
      # --- media / docs ---
      - ffmpeg
      - exiftool
      - pandoc
      # --- datos / lenguajes ---
      - node
      - uv
      - postgresql@18
      - rclone
      # --- red ---
      - nmap
      - telnet
      # --- AI tooling ---
      - aider
      - opencode
    casks:
      # instalados via brew hoy
      - claude-code
      - gcloud-cli
      - karabiner-elements
      - ngrok
      - slack
      - telegram
      - spotify
      - sublime-text
      - tunnelblick
      - protonvpn
      - licecap
      - macdown
      - nvalt
      - scout
      - textmate
      # instalados hoy FUERA de brew (en /Applications) — el script usa
      # --adopt, así que brew los adopta sin reinstalar; en una máquina
      # nueva se instalan solos
      - iterm2
      - visual-studio-code
      - cursor
      - docker-desktop
      - lens
      - ollama
      - tailscale
      - alfred
      - stats
      - betterdisplay
      - monosnap
      - brave-browser
      - google-chrome
      - google-drive
      - discord
      - whatsapp
      # personales, descomentá si los querés en el bootstrap:
      #- steam
      #- battle-net
      #- epic-games
      #- whisky
      #- anydesk
      #- teamviewer
  linux:
    apt:
      # básicos para operar este repo
      - git
      - curl
      - wget
      - zsh
      - unzip
      # terminal / productividad
      - jq
      - ripgrep
      - fzf
      - bat
      - tree
      - htop
      - tmux
      - shellcheck
      - gnupg
      - xclip
      # python para CLIs de cloud
      - python3
      - python3-pip
      - python3-venv
    # Solo en Linux de escritorio (se saltean en WSL)
    apt_desktop:
      - flameshot
  # Herramientas con versión gestionada por mise (reemplaza tfenv/tgenv:
  # mise respeta los archivos .terraform-version / .terragrunt-version
  # que ya tengas en tus proyectos). kubectl/helm/kustomize van por brew.
  mise:
    - terraform
    - terragrunt
    - opentofu
  # Globales de npm (inventario real: npm ls -g, 2026-07-31)
  npm_global:
    - pnpm
    - "@qwen-code/qwen-code"
    - ecc-universal
    - mcp-ssh-manager
