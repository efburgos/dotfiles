name: CI
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (scripts planos)
        run: |
          shopt -s globstar nullglob
          files=(install.sh dot_local/bin/executable_*)
          shellcheck "${files[@]}"
      - name: shellcheck (templates renderizados a bash puro)
        run: |
          # Los .tmpl tienen sintaxis Go template; los chequeamos quitando
          # las líneas de template para validar el bash restante.
          shopt -s globstar nullglob
          for f in .chezmoiscripts/*.sh.tmpl; do
            echo "== $f"
            sed -e 's/{{[^}]*}}//g' "$f" | shellcheck -s bash - || exit 1
          done
