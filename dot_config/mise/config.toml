# Versiones GLOBALES de herramientas (mise) — https://mise.jdx.dev/
# Reemplaza tfenv/tgenv: mise respeta .terraform-version y
# .terragrunt-version por proyecto, así que la migración es transparente.
# Por proyecto también podés crear un mise.toml para pinnear versiones.
#
# kubectl/helm/kustomize/k9s se instalan por brew (ver packages.yaml);
# acá solo lo que necesita versionado fino por proyecto.

[tools]
terraform = "latest"
terragrunt = "latest"
opentofu = "latest"

[settings]
experimental = true
